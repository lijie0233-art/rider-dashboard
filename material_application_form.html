<title>骑手物料申请表 Rider Material Request</title>

<style>
  :root{--ink:#101828;--muted:#5f4b00;--line:rgba(17,24,39,.14);--bg:#ffd400;--card:#fffdf2;--brand:#ffd400;--brand2:#ffea55;--dark:#050505;--ok:#079455;--bad:#d92d20;--warn:#b54708;--blue:#2563eb}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffd400 0%,#ffdd18 48%,#fff06a 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}.page{max-width:980px;margin:0 auto;padding:24px 16px 46px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;background:rgba(255,212,0,.72);border:1px solid rgba(17,24,39,.12);border-radius:26px;padding:14px 16px;box-shadow:0 18px 40px rgba(17,24,39,.12)}.brand{display:flex;align-items:center;gap:14px}.logo{width:112px;height:82px;border-radius:18px;background:#ffd400;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid rgba(17,24,39,.10);box-shadow:0 12px 26px rgba(17,24,39,.16);flex:0 0 auto}.logo img{width:100%;height:100%;object-fit:contain;display:block}h1{font-size:24px;margin:0 0 4px;color:#050505;font-weight:1000}.sub{color:var(--muted);font-size:13px;line-height:1.55}.langSwitch{display:inline-flex;background:#fff8c7;border:1px solid rgba(17,24,39,.15);border-radius:999px;padding:4px;box-shadow:0 8px 20px rgba(15,23,42,.10)}.langSwitch button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer;color:var(--muted)}.langSwitch button.active{background:var(--dark);color:#fff}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(17,24,39,.14);border-radius:24px;padding:18px;box-shadow:0 18px 42px rgba(17,24,39,.12);margin:14px 0}.panelHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}h2{font-size:18px;margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:7px}.field span{font-size:12px;color:var(--muted);font-weight:900}.field .inlineHint{display:inline-block;margin-left:6px;font-size:11px;color:#8a6b00;font-weight:950;background:#fff8c7;border:1px solid rgba(17,24,39,.10);border-radius:999px;padding:2px 7px}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(17,24,39,.16);border-radius:14px;padding:12px 12px;background:#fff;color:var(--ink);font-weight:750;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.08)}.itemsBox{display:grid;gap:10px;margin-top:10px}.itemRow{display:grid;grid-template-columns:1.2fr 1fr 100px auto;gap:9px;align-items:end;border:1px solid rgba(17,24,39,.10);background:#fffbea;border-radius:18px;padding:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-weight:950;cursor:pointer;color:var(--ink);box-shadow:0 8px 18px rgba(15,23,42,.05)}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#050505;color:#ffd400;border-color:#050505}.btn.danger{background:#fff;color:var(--bad);border-color:#fecdca}.btn.small{padding:9px 11px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:12px;color:var(--muted);margin-top:9px}.notice{display:none;margin-top:12px;border-radius:18px;padding:14px;border:1px solid #b2ddff;background:#eff8ff;color:#175cd3;line-height:1.55}.notice.show{display:block}.caseNo{font-size:22px;font-weight:1000;letter-spacing:.03em;color:#111827}.queryResult{display:none;margin-top:12px}.queryResult.show{display:block}.statusCard{border:1px solid var(--line);border-radius:20px;background:#fff;padding:16px}.statusTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;background:#f2f4f7;color:#475467}.pill.ok{background:#ecfdf3;color:#027a48}.pill.bad{background:#fee4e2;color:#b42318}.pill.warn{background:#fffaeb;color:#b54708}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0;color:#475467;font-size:14px}.meta b{color:#111827}.detailList{display:grid;gap:8px;margin:12px 0}.detailItem{display:flex;justify-content:space-between;gap:10px;border:1px solid #eef2f7;background:#f8fafc;border-radius:14px;padding:10px 12px;font-size:14px}.timeline{display:grid;gap:8px;margin-top:12px}.timeline div{display:flex;justify-content:space-between;gap:10px;border-left:4px solid #e5e7eb;padding:3px 0 3px 10px;color:#475467;font-size:13px}.timeline div.done{border-color:var(--ok)}.timeline b{color:#111827}.empty{border:1px dashed #d0d5dd;background:#f8fafc;border-radius:18px;padding:18px;text-align:center;color:#667085;font-weight:800}.footer{margin-top:18px;text-align:center;color:#4a3b00;font-size:12px;font-weight:900}@media(max-width:760px){.top,.panelHead{display:grid}.grid,.meta{grid-template-columns:1fr}.itemRow{grid-template-columns:1fr}.page{padding:14px 12px 34px}.logo{width:92px;height:68px}h1{font-size:21px}}
</style>

 zh:{title:'骑手物料申请表',subtitle:'提交申领需求后，请保存案例编号，用于后续查询处理进度。',requestTitle:'① 申领装备需求',requestSub:'填写基本信息，并选择需要申领的装备名称与尺码 / 规格。',name:'姓名',namePh:'请输入姓名',phone:'骑手注册手机号',phonePh:'请输入注册手机号',region:'所属区域',pickupDate:'预约领取日期',pickupLimit:'仅限周一至周五 Mon-Fri，节假日除外',pickupSlot:'预约领取时段',pickupSlotPh:'请选择领取时段',pickupMorning:'上午 11:30-12:45',pickupAfternoon:'下午 14:30-17:45',appointment:'预约领取时间',remark:'备注',remarkPh:'可补充特殊情况，非必填',itemsTitle:'申领装备',addItem:'新增一项装备',submit:'提交申请',saveHint:'请保存案例编号，用于进度查询',queryTitle:'② 进度查询区',querySub:'输入案例编号即可检索申请状态，点击结果可查看完整处理流程及各节点操作时间。',caseLabel:'案例编号',casePh:'例如 MAT-20260702-AB12',query:'查询进度',equipment:'装备名称',spec:'尺码 / 规格',qty:'数量',remove:'删除',submitted:'申请已提交',copy:'请保存案例编号，用于进度查询',pending:'待审核',approved:'审核通过',rejected:'审核拒绝',notReceived:'未领取',received:'已领取',submitTime:'提交时间',approveTime:'审核通过时间',rejectTime:'审核拒绝时间',pickupTime:'领取完成时间',detail:'申领明细',process:'处理流程',notFound:'未查询到该案例编号，请检查后重试。',required:'请完整填写姓名、手机号、区域、预约领取时间，并至少选择一项装备。',loading:'处理中…',submitFail:'提交失败，请稍后重试或联系平台中心。',queryFail:'查询失败，请稍后重试。',invalidPickupDate:'预约领取日期仅限周一至周五，节假日除外。',total:'申领总数量',status:'申请状态',pickup:'领取状态',basic:'基础信息',pickupGuideTitle:'领取提示',pickupGuide:'您的物料申请已通过，请联系 Whatsapp 司管号 + 61431197132 或前往 Suite 2, Level 17，1 Market Street Sydney NSW 2000 领取你的装备物料'},
 en:{title:'Rider Material Request Form',subtitle:'After submission, please save your case number for status tracking.',requestTitle:'① Material Request',requestSub:'Fill in your details and select the equipment plus size/specification you need.',name:'Name',namePh:'Enter your name',phone:'Registered rider phone',phonePh:'Enter registered phone number',region:'Region',pickupDate:'Pickup date',pickupLimit:'Mon-Fri only, excluding public holidays',pickupSlot:'Pickup time slot',pickupSlotPh:'Select pickup time slot',pickupMorning:'Morning 11:30-12:45',pickupAfternoon:'Afternoon 14:30-17:45',appointment:'Pickup appointment',remark:'Remark',remarkPh:'Optional notes',itemsTitle:'Requested equipment',addItem:'Add item',submit:'Submit request',saveHint:'Please save the case number for progress tracking',queryTitle:'② Progress Lookup',querySub:'Enter your case number to check status. Click the result to view full workflow and timestamps.',caseLabel:'Case number',casePh:'e.g. MAT-20260702-AB12',query:'Check status',equipment:'Equipment',spec:'Size / Spec',qty:'Qty',remove:'Remove',submitted:'Request submitted',copy:'Please save this case number for progress tracking',pending:'Pending review',approved:'Approved',rejected:'Rejected',notReceived:'Not collected',received:'Collected',submitTime:'Submitted at',approveTime:'Approved at',rejectTime:'Rejected at',pickupTime:'Collected at',detail:'Request details',process:'Workflow',notFound:'No record found for this case number. Please check and try again.',required:'Please fill in name, phone, region, pickup appointment and select at least one item.',loading:'Processing…',submitFail:'Submission failed. Please try again later or contact support.',queryFail:'Lookup failed. Please try again later.',invalidPickupDate:'Pickup date is available Monday to Friday only, excluding public holidays.',total:'Total quantity',status:'Review status',pickup:'Pickup status',basic:'Basic info',pickupGuideTitle:'Pickup notice',pickupGuide:'Your material request has been approved. Please contact the WhatsApp station manager at +61 431 197 132 or visit Suite 2, Level 17, 1 Market Street, Sydney NSW 2000 to collect your equipment.'}
};
function t(k){return (dict[lang]&&dict[lang][k])||dict.zh[k]||k}
function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function specsArray(v){if(Array.isArray(v))return v.map(x=>String(x||'').trim()).filter(Boolean);if(typeof v==='string'){try{const j=JSON.parse(v);if(Array.isArray(j))return j}catch(_){ }return v.split(/[，,\n/|]+/).map(s=>s.trim()).filter(Boolean)}return []}
function appClient(){if(!client)client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);return client}
function dateText(v){if(!v)return '-';try{return new Date(v).toLocaleString(lang==='zh'?'zh-CN':'en-AU',{hour12:false})}catch(_){return String(v)}}
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('langZh').classList.toggle('active',lang==='zh');$('langEn').classList.toggle('active',lang==='en');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));renderRegions();renderPickupSlots();renderItemRows();}
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function isWeekdayDate(v){if(!v)return false;const d=new Date(v+'T00:00:00');const day=d.getDay();return day>=1&&day<=5}
function setupPickupDate(){const el=$('pickupDate');if(!el)return;el.min=todayISO();el.onchange=()=>{if(el.value&&!isWeekdayDate(el.value)){alert(t('invalidPickupDate'));el.value=''}}}
function renderPickupSlots(){const sel=$('pickupSlot');if(!sel)return;const old=sel.value;sel.innerHTML=`<option value="">${t('pickupSlotPh')}</option><option value="morning_1130_1245">${t('pickupMorning')}</option><option value="afternoon_1430_1745">${t('pickupAfternoon')}</option>`;sel.value=old||''}
function pickupSlotText(v){return {morning_1130_1245:t('pickupMorning'),afternoon_1430_1745:t('pickupAfternoon')}[v]||v||'-'}
function renderRegions(){const old=$('riderRegion').value;$('riderRegion').innerHTML=`<option value="">${lang==='zh'?'请选择区域':'Select region'}</option>`+REGIONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');$('riderRegion').value=old||''}
async function loadItems(){try{const {data,error}=await appClient().from(MATERIAL_ITEMS_TABLE).select('*').eq('is_active',true).order('sort_order',{ascending:true}).order('created_at',{ascending:true});if(error)throw error;items=(data||[]).map(x=>({name:x.equipment_name,specs:specsArray(x.specs)})).filter(x=>x.name)}catch(e){console.warn(e);items=[{name:'雨衣',specs:['S','M','L','XL','2XL','3XL']},{name:'马甲',specs:['S','M','L','XL','2XL','3XL']},{name:'外卖箱',specs:['标准','大号']},{name:'外卖包',specs:['标准','大号']}]}renderItemRows()}
function itemOptions(selected=''){return `<option value="">${lang==='zh'?'请选择装备':'Select item'}</option>`+items.map(x=>`<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function specOptions(itemName,selected=''){const it=items.find(x=>x.name===itemName);const specs=(it&&it.specs&&it.specs.length?it.specs:['标准']);return specs.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function addItemRow(data={}){const box=$('itemRows');const div=document.createElement('div');div.className='itemRow';div.innerHTML=`<label class="field"><span>${t('equipment')}</span><select class="equipSel">${itemOptions(data.equipment_name||'')}</select></label><label class="field"><span>${t('spec')}</span><select class="specSel"></select></label><label class="field"><span>${t('qty')}</span><input class="qtyInp" type="number" min="1" step="1" value="${Number(data.qty)||1}" /></label><button class="btn danger small removeBtn" type="button">${t('remove')}</button>`;box.appendChild(div);const equip=div.querySelector('.equipSel'),spec=div.querySelector('.specSel');function refreshSpec(){spec.innerHTML=specOptions(equip.value,data.spec||'');data.spec=''}equip.onchange=refreshSpec;div.querySelector('.removeBtn').onclick=()=>{if(document.querySelectorAll('.itemRow').length>1)div.remove();else{equip.value='';refreshSpec();div.querySelector('.qtyInp').value=1}};refreshSpec();if(data.spec)spec.value=data.spec;}
function readRows(){return [...document.querySelectorAll('.itemRow')].map(row=>({equipment_name:row.querySelector('.equipSel').value,spec:row.querySelector('.specSel').value,qty:Math.max(1,Math.floor(Number(row.querySelector('.qtyInp').value)||1))})).filter(x=>x.equipment_name&&x.spec)}
function renderItemRows(){const current=readRows();$('itemRows').innerHTML='';(current.length?current:[{}]).forEach(addItemRow)}
function genCaseNo(){const d=new Date();const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');const rand=Math.random().toString(36).slice(2,6).toUpperCase();return `MAT-${ymd}-${rand}`}
async function submitForm(){const name=$('riderName').value.trim(),phone=$('riderPhone').value.trim(),region=$('riderRegion').value.trim(),pickupDate=$('pickupDate').value.trim(),pickupSlot=$('pickupSlot').value.trim(),remark=$('riderRemark').value.trim(),rows=readRows();if(!name||!phone||!region||!pickupDate||!pickupSlot||!rows.length){alert(t('required'));return}if(!isWeekdayDate(pickupDate)){alert(t('invalidPickupDate'));return}$('submitBtn').disabled=true;$('submitBtn').textContent=t('loading');let ok=false,caseNo='';try{for(let i=0;i<4&&!ok;i++){caseNo=genCaseNo();const payload={case_no:caseNo,rider_name:name,rider_phone:phone,region,requested_pickup_date:pickupDate,requested_pickup_time_slot:pickupSlot,remark,items:rows,total_qty:rows.reduce((s,x)=>s+x.qty,0),review_status:'pending',pickup_status:'not_received'};const {error}=await appClient().from(MATERIAL_APPLICATIONS_TABLE).insert(payload);if(!error){ok=true;break}if(!String(error.message||'').toLowerCase().includes('duplicate'))throw error}if(!ok)throw new Error('case number conflict');$('submitNotice').className='notice show';$('submitNotice').innerHTML=`<b>${t('submitted')}</b><div class="caseNo">${esc(caseNo)}</div><div>${t('copy')}</div>`;$('caseSearch').value=caseNo;document.querySelectorAll('#riderName,#riderPhone,#riderRemark').forEach(el=>el.value='');$('riderRegion').value='';$('pickupDate').value='';$('pickupSlot').value='';$('itemRows').innerHTML='';addItemRow()}catch(e){console.warn(e);alert(t('submitFail'))}finally{$('submitBtn').disabled=false;$('submitBtn').textContent=t('submit')}}
function statusText(s){return {pending:t('pending'),approved:t('approved'),rejected:t('rejected')}[s]||t('pending')}
function pickupText(s){return s==='received'?t('received'):t('notReceived')}
function statusCls(s){return s==='approved'?'ok':s==='rejected'?'bad':'warn'}
function renderStatus(x){const rows=Array.isArray(x.items)?x.items:(typeof x.items==='string'?JSON.parse(x.items||'[]'):[]);const total=Number(x.total_qty)||rows.reduce((s,it)=>s+(Number(it.qty)||1),0);const timeline=[['submitTime',x.created_at,true],['approveTime',x.approved_at,!!x.approved_at],['rejectTime',x.rejected_at,!!x.rejected_at],['pickupTime',x.picked_up_at,!!x.picked_up_at]];const pickupGuide=x.review_status==='approved'?`<div class="done" style="border-color:var(--ok);background:#ecfdf3;border-radius:14px;padding:10px 12px;margin-top:4px;display:block;color:#027a48;line-height:1.65"><b>${t('pickupGuideTitle')}</b><span style="display:block;margin-top:4px">${t('pickupGuide')}</span></div>`:'';$('queryResult').className='queryResult show';$('queryResult').innerHTML=`<div class="statusCard"><div class="statusTop"><div><div class="caseNo">${esc(x.case_no)}</div><div class="sub">${t('basic')} · ${esc(x.rider_name||'-')} / ${esc(x.rider_phone||'-')}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="pill ${statusCls(x.review_status)}">${statusText(x.review_status)}</span><span class="pill ${x.pickup_status==='received'?'ok':'warn'}">${pickupText(x.pickup_status)}</span></div></div><div class="meta"><div><b>${t('region')}：</b>${esc(x.region||'-')}</div><div><b>${t('total')}：</b>${esc(total)}</div><div><b>${t('appointment')}：</b>${esc(x.requested_pickup_date||'-')} ${esc(pickupSlotText(x.requested_pickup_time_slot))}</div><div><b>${t('status')}：</b>${statusText(x.review_status)}</div><div><b>${t('pickup')}：</b>${pickupText(x.pickup_status)}</div></div>${x.remark?`<div class="sub"><b>${t('remark')}：</b>${esc(x.remark)}</div>`:''}<h3 style="margin:14px 0 8px;font-size:15px">${t('detail')}</h3><div class="detailList">${rows.map(it=>`<div class="detailItem"><span>${esc(it.equipment_name||it.name||'-')} · ${esc(it.spec||it.size||'标准')}</span><b>x ${esc(Number(it.qty)||1)}</b></div>`).join('')||'<div class="empty">-</div>'}</div><h3 style="margin:14px 0 8px;font-size:15px">${t('process')}</h3><div class="timeline">${timeline.filter(r=>r[1]).map(r=>`<div class="${r[2]?'done':''}"><b>${t(r[0])}</b><span>${dateText(r[1])}</span></div>`).join('')}${pickupGuide}</div></div>`}
async function queryStatus(){const caseNo=$('caseSearch').value.trim();if(!caseNo)return;$('queryBtn').disabled=true;$('queryBtn').textContent=t('loading');try{let row=null;const {data,error}=await appClient().rpc('get_material_application_status',{p_case_no:caseNo});if(error)throw error;row=Array.isArray(data)?data[0]:data;if(!row){$('queryResult').className='queryResult show';$('queryResult').innerHTML=`<div class="empty">${t('notFound')}</div>`;return}renderStatus(row)}catch(e){console.warn(e);$('queryResult').className='queryResult show';$('queryResult').innerHTML=`<div class="empty">${t('queryFail')}</div>`}finally{$('queryBtn').disabled=false;$('queryBtn').textContent=t('query')}}
function setupRealtime(){try{appClient().channel('material-form-items-sync').on('postgres_changes',{event:'*',schema:'public',table:MATERIAL_ITEMS_TABLE},()=>loadItems()).subscribe()}catch(e){console.warn(e)}}
$('langZh').onclick=()=>{lang='zh';applyLang()};$('langEn').onclick=()=>{lang='en';applyLang()};$('addItemBtn').onclick=()=>addItemRow();$('submitBtn').onclick=submitForm;$('queryBtn').onclick=queryStatus;$('caseSearch').addEventListener('keydown',e=>{if(e.key==='Enter')queryStatus()});applyLang();setupPickupDate();loadItems();setupRealtime();
</script>
</body>
