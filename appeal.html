<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>订单申诉填写表｜Order Appeal Submission Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--yellow:#ffd400;--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fb;--blue:#2563eb;--green:#079455;--red:#d92d20;--shadow:0 20px 60px rgba(16,24,40,.12)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7cc 0,#fff 32%,#f6f7fb 100%);color:var(--ink)}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(820px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:48px;height:48px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 10px 24px rgba(17,24,39,.12)}h1{font-size:24px;margin:0;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin:5px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field.full{grid-column:1/-1}.field span{font-size:13px;font-weight:900;color:#344054}.en{font-weight:800;color:#667085}.field input,.field select,.field textarea{font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:140px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.08)}.hint{font-size:12px;color:var(--muted);line-height:1.65;white-space:pre-line}.photoBox{background:#f9fafb;border:1px dashed #cbd5e1;border-radius:16px;padding:12px}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.primary{background:#111827;color:#ffd400;border-color:#111827}.msg{min-height:22px;font-size:13px;font-weight:850;margin-top:10px}.ok{color:var(--green)}.err{color:var(--red)}.successBox{display:none;background:#ecfdf3;border:1px solid #bbf7d0;color:#065f46;border-radius:18px;padding:16px;margin-top:14px;line-height:1.7}.successBox.show{display:block}@media(max-width:680px){.card{padding:18px;border-radius:22px}.grid{grid-template-columns:1fr}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>
<div class="page">
  <form class="card" id="appealForm">
    <div class="brand"><div class="logo">🐼</div><div><h1>订单申诉填写表 <span class="en">Order Appeal Submission Center</span></h1><p class="sub">无需登录。请如实填写订单情况并上传相关图片，提交后将进入站内“申诉订单处理中心”。</p></div></div>
    <div class="grid">
      <label class="field"><span>姓名 <span class="en">Name</span> *</span><input id="applicantName" required placeholder="请输入姓名 / Name" /></label>
      <label class="field"><span>手机号 <span class="en">Whatsapp Account</span> *</span><input id="phone" required inputmode="tel" placeholder="请输入手机号 / Whatsapp Account" /></label>
      <label class="field"><span>问题订单号 <span class="en">Problematic Order Number</span> *</span><input id="orderNo" required placeholder="请输入订单号 / Order Number" /></label>
      <label class="field"><span>申诉原因分类 <span class="en">Reason For Appeal</span> *</span><select id="reasonCategory" required><option value="">请选择 / Please select</option><option value="撒餐">撒餐 Spilled Food</option><option value="漏餐">漏餐 Missing Items</option><option value="超时退款">超时退款 Late Delivery Refund</option><option value="丢餐">丢餐 Stolen Food</option><option value="错餐">错餐 Wrong Order / Incorrect Order</option><option value="其他">其他 Other</option></select></label>
      <label class="field full"><span>详细说明订单情况 <span class="en">Detailed Description of the Issue</span> *</span><textarea id="detail" required placeholder="请描述订单的具体问题，特别是关于扣款情况的详细信息。例如：事件发生的经过、你认为不合理之处、你希望如何处理等。&#10;你的解释非常重要，将作为审核是否通过的重要依据，请尽量描述清楚、具体。&#10;&#10;Please provide a clear explanation of the issue with the order, especially regarding the deduction or charge. Include what happened, why you believe it was incorrect or unfair, and what outcome you are requesting.&#10;Your explanation is very important and will directly affect whether the appeal can be approved — please be as detailed and accurate as possible."></textarea><div class="hint">请描述订单的具体问题，特别是关于扣款情况的详细信息。例如：事件发生的经过、你认为不合理之处、你希望如何处理等。
你的解释非常重要，将作为审核是否通过的重要依据，请尽量描述清楚、具体。
Please provide a clear explanation of the issue with the order, especially regarding the deduction or charge. Include what happened, why you believe it was incorrect or unfair, and what outcome you are requesting.
Your explanation is very important and will directly affect whether the appeal can be approved — please be as detailed and accurate as possible.</div></label>
      <label class="field full photoBox"><span>放餐照片 <span class="en">Drop-off Photo</span></span><input id="mealPhotos" type="file" accept="image/*" multiple /><div class="hint">请上传订单送达时的现场照片，用于证明已完成放餐（例如：将餐品放在客户门口、前台等位置的照片）
Please upload a photo taken at the time of delivery to prove the food was placed as required (e.g., at the customer’s door, front desk, etc.).</div></label>
      <label class="field full photoBox"><span>通话记录照片 <span class="en">Call Record</span></span><input id="callPhotos" type="file" accept="image/*" multiple /><div class="hint">如您与客户或平台有通话沟通，请上传通话记录截图或相关凭证，以便我们更全面地了解沟通情况。
If there was a phone conversation with the customer or the platform, please upload a screenshot or record of the call to help us better understand the situation.</div></label>
      <label class="field full photoBox"><span>更多照片 <span class="en">Additional Images</span></span><input id="morePhotos" type="file" accept="image/*" multiple /><div class="hint">截图、照片、聊天记录等
Upload Supporting Materials (e.g. screenshots, photos, chat records, etc.)</div></label>
      <label class="field full"><span>备注 <span class="en">Other information</span></span><textarea id="remark" placeholder="其他补充信息，可不填 / Other information"></textarea></label>
    </div>
    <div class="actions"><button class="btn" type="reset">清空</button><button class="btn primary" id="submitBtn" type="submit">提交申诉</button></div>
    <div class="msg" id="formMsg"></div>
    <div class="successBox" id="successBox">提交成功！我们已收到你的订单申诉，处理人会在站内申诉订单处理中心查看并审核。</div>
  </form>
</div>
<script>
const CLOUD_CONFIG={url:'https://pxgfvdcajbkviijayemo.supabase.co',anonKey:'sb_publishable_iDwyhhC-3R2gjXaVveAwtg_1Yb16RAy',table:'order_appeals',bucket:'order-appeals'};
const client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);
const byId=id=>document.getElementById(id);
function fileExt(file){const name=String(file?.name||'');const m=name.match(/\.([a-zA-Z0-9]{1,8})$/);if(m)return m[0].toLowerCase();const type=String(file?.type||'');if(type.includes('png'))return '.png';if(type.includes('webp'))return '.webp';if(type.includes('gif'))return '.gif';return '.jpg'}
async function uploadFiles(appealId,fieldId,folder){const input=byId(fieldId);const files=Array.from(input?.files||[]);const urls=[];for(let i=0;i<files.length;i++){const f=files[i];const path=`${appealId}/${folder}/${Date.now()}_${i}${fileExt(f)}`;const {error}=await client.storage.from(CLOUD_CONFIG.bucket).upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(error)throw new Error(`上传${folder}照片失败：${error.message}`);const {data}=client.storage.from(CLOUD_CONFIG.bucket).getPublicUrl(path);if(data?.publicUrl)urls.push(data.publicUrl)}return urls}
byId('appealForm').addEventListener('submit',async e=>{e.preventDefault();const msg=byId('formMsg'),btn=byId('submitBtn'),success=byId('successBox');msg.className='msg';msg.textContent='正在提交，请稍候...';success.classList.remove('show');btn.disabled=true;try{const id=(crypto.randomUUID&&crypto.randomUUID())||String(Date.now());const meal=await uploadFiles(id,'mealPhotos','meal');const call=await uploadFiles(id,'callPhotos','call');const more=await uploadFiles(id,'morePhotos','more');const payload={id,applicant_name:byId('applicantName').value.trim(),phone:byId('phone').value.trim(),order_no:byId('orderNo').value.trim(),reason_category:byId('reasonCategory').value,detail:byId('detail').value.trim(),meal_photo_urls:meal,call_photo_urls:call,more_photo_urls:more,remark:byId('remark').value.trim(),review_result:'待审核'};const {error}=await client.from(CLOUD_CONFIG.table).insert(payload);if(error)throw error;msg.className='msg ok';msg.textContent='提交成功';success.classList.add('show');e.target.reset()}catch(err){msg.className='msg err';msg.textContent='提交失败：'+(err.message||err)}finally{btn.disabled=false}});
</script>
</body>
</html>
