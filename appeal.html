<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订单申诉填写表｜熊猫外卖</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--yellow:#ffd400;--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fb;--blue:#2563eb;--green:#079455;--red:#d92d20;--shadow:0 20px 60px rgba(16,24,40,.12)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7cc 0,#fff 32%,#f6f7fb 100%);color:var(--ink)}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(760px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:48px;height:48px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 10px 24px rgba(17,24,39,.12)}h1{font-size:24px;margin:0;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin:5px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field.full{grid-column:1/-1}.field span{font-size:13px;font-weight:900;color:#344054}.field input,.field select,.field textarea{font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.08)}.hint{font-size:12px;color:var(--muted);line-height:1.5}.photoBox{background:#f9fafb;border:1px dashed #cbd5e1;border-radius:16px;padding:12px}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.primary{background:#111827;color:#ffd400;border-color:#111827}.msg{min-height:22px;font-size:13px;font-weight:850;margin-top:10px}.ok{color:var(--green)}.err{color:var(--red)}.successBox{display:none;background:#ecfdf3;border:1px solid #bbf7d0;color:#065f46;border-radius:18px;padding:16px;margin-top:14px;line-height:1.7}.successBox.show{display:block}@media(max-width:680px){.card{padding:18px;border-radius:22px}.grid{grid-template-columns:1fr}.actions{display:grid}.btn{width:100%}}
</style>
</head>
<body>
<div class="page">
  <form class="card" id="appealForm">
    <div class="brand"><div class="logo">🐼</div><div><h1>订单申诉填写表</h1><p class="sub">无需登录。请如实填写订单情况并上传相关图片，提交后将进入站内“申诉订单处理中心”。</p></div></div>
    <div class="grid">
      <label class="field"><span>姓名 *</span><input id="applicantName" required placeholder="请输入姓名" /></label>
      <label class="field"><span>手机号 *</span><input id="phone" required inputmode="tel" placeholder="请输入手机号" /></label>
      <label class="field"><span>问题订单号 *</span><input id="orderNo" required placeholder="请输入订单号" /></label>
      <label class="field"><span>申诉原因分类 *</span><select id="reasonCategory" required><option value="">请选择</option><option>撒餐</option><option>漏餐</option><option>超时退款</option><option>丢餐</option><option>错餐</option><option>其他</option></select></label>
      <label class="field full"><span>详细说明订单情况 *</span><textarea id="detail" required placeholder="请说明发生时间、现场情况、已沟通内容等"></textarea></label>
      <label class="field full photoBox"><span>放餐照片</span><input id="mealPhotos" type="file" accept="image/*" multiple /><div class="hint">可上传 1 张或多张。</div></label>
      <label class="field full photoBox"><span>通话记录照片</span><input id="callPhotos" type="file" accept="image/*" multiple /><div class="hint">如有与客户/商家的通话记录，可在这里上传。</div></label>
      <label class="field full photoBox"><span>更多照片</span><input id="morePhotos" type="file" accept="image/*" multiple /><div class="hint">其他能说明情况的图片。</div></label>
      <label class="field full"><span>备注</span><textarea id="remark" placeholder="其他补充信息，可不填"></textarea></label>
    </div>
    <div class="actions"><button class="btn" type="reset">清空</button><button class="btn primary" id="submitBtn" type="submit">提交申诉</button></div>
    <div class="msg" id="formMsg"></div>
    <div class="successBox" id="successBox">提交成功！我们已收到你的订单申诉，处理人会在站内申诉订单处理中心查看并审核。</div>
  </form>
</div>
<script>
const CLOUD_CONFIG={url:'https://pxgfvdcajbkviijayemo.supabase.co',anonKey:'sb_publishable_iDwyhhC-3R2gjXaVveAwtg_1Yb16RAy',table:'order_appeals',bucket:'order-appeals'};
const client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);
const byId=id=>document.getElementById(id);
function safeFileName(name){return String(name||'photo').replace(/[^a-zA-Z0-9.\-_\u4e00-\u9fa5]/g,'_').slice(-80)}
async function uploadFiles(appealId,fieldId,folder){const input=byId(fieldId);const files=Array.from(input?.files||[]);const urls=[];for(let i=0;i<files.length;i++){const f=files[i];const path=`${appealId}/${folder}/${Date.now()}_${i}_${safeFileName(f.name)}`;const {error}=await client.storage.from(CLOUD_CONFIG.bucket).upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(error)throw new Error(`上传${folder}照片失败：${error.message}`);const {data}=client.storage.from(CLOUD_CONFIG.bucket).getPublicUrl(path);if(data?.publicUrl)urls.push(data.publicUrl)}return urls}
byId('appealForm').addEventListener('submit',async e=>{e.preventDefault();const msg=byId('formMsg'),btn=byId('submitBtn'),success=byId('successBox');msg.className='msg';msg.textContent='正在提交，请稍候...';success.classList.remove('show');btn.disabled=true;try{const id=(crypto.randomUUID&&crypto.randomUUID())||String(Date.now());const meal=await uploadFiles(id,'mealPhotos','meal');const call=await uploadFiles(id,'callPhotos','call');const more=await uploadFiles(id,'morePhotos','more');const payload={id,applicant_name:byId('applicantName').value.trim(),phone:byId('phone').value.trim(),order_no:byId('orderNo').value.trim(),reason_category:byId('reasonCategory').value,detail:byId('detail').value.trim(),meal_photo_urls:meal,call_photo_urls:call,more_photo_urls:more,remark:byId('remark').value.trim(),review_result:'待审核'};const {error}=await client.from(CLOUD_CONFIG.table).insert(payload);if(error)throw error;msg.className='msg ok';msg.textContent='提交成功';success.classList.add('show');e.target.reset()}catch(err){msg.className='msg err';msg.textContent='提交失败：'+(err.message||err)}finally{btn.disabled=false}});
</script>
</body>
</html>
