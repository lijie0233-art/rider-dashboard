:root{--yellow:#ffd400;--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f8fb;--blue:#2563eb;--green:#079455;--red:#d92d20;--shadow:0 20px 60px rgba(16,24,40,.12)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7cc 0,#fff 32%,#f6f7fb 100%);color:var(--ink)}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(820px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:68px;height:68px;border-radius:16px;background:var(--yellow);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(17,24,39,.12);overflow:hidden;flex:0 0 auto}.logo img{width:100%;height:100%;object-fit:cover;display:block}h1{font-size:24px;margin:0;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin:5px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field.full{grid-column:1/-1}.field span{font-size:13px;font-weight:900;color:#344054}.en{font-weight:800;color:#667085}.field input,.field select,.field textarea{font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:140px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.08)}.hint{font-size:12px;color:var(--muted);line-height:1.65;white-space:pre-line}.photoBox{background:#f9fafb;border:1px dashed #cbd5e1;border-radius:16px;padding:12px}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.primary{background:#111827;color:#ffd400;border-color:#111827}.msg{min-height:22px;font-size:13px;font-weight:850;margin-top:10px}.ok{color:var(--green)}.err{color:var(--red)}.successBox{display:none;background:#ecfdf3;border:1px solid #bbf7d0;color:#065f46;border-radius:18px;padding:16px;margin-top:14px;line-height:1.7}.successBox.show{display:block}@media(max-width:680px){.card{padding:18px;border-radius:22px}.grid{grid-template-columns:1fr}.actions{display:grid}.btn{width:100%}}


</style>

const client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey);

function fileExt(file){const name=String(file?.name||'');const m=name.match(/\.([a-zA-Z0-9]{1,8})$/);if(m)return m[0].toLowerCase();const type=String(file?.type||'');if(type.includes('png'))return '.png';if(type.includes('webp'))return '.webp';if(type.includes('gif'))return '.gif';return '.jpg'}
async function uploadFiles(appealId,fieldId,folder){const input=byId(fieldId);const files=Array.from(input?.files||[]);const urls=[];for(let i=0;i<files.length;i++){const f=files[i];const path=`${appealId}/${folder}/${Date.now()}_${i}${fileExt(f)}`;const {error}=await client.storage.from(CLOUD_CONFIG.bucket).upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(error)throw new Error(`上传${folder}照片失败：${error.message}`);const {data}=client.storage.from(CLOUD_CONFIG.bucket).getPublicUrl(path);if(data?.publicUrl)urls.push(data.publicUrl)}return urls}
byId('appealForm').addEventListener('submit',async e=>{e.preventDefault();const msg=byId('formMsg'),btn=byId('submitBtn'),success=byId('successBox');msg.className='msg';msg.textContent='正在提交，请稍候...';success.classList.remove('show');btn.disabled=true;try{const id=(crypto.randomUUID&&crypto.randomUUID())||String(Date.now());const meal=await uploadFiles(id,'mealPhotos','meal');const call=await uploadFiles(id,'callPhotos','call');const more=await uploadFiles(id,'morePhotos','more');const payload={id,applicant_name:byId('applicantName').value.trim(),phone:byId('phone').value.trim(),order_no:byId('orderNo').value.trim(),reason_category:byId('reasonCategory').value,appeal_area:byId('appealArea').value,detail:byId('detail').value.trim(),meal_photo_urls:meal,call_photo_urls:call,more_photo_urls:more,remark:byId('remark').value.trim(),review_result:'待审核'};const {error}=await client.from(CLOUD_CONFIG.table).insert(payload);if(error)throw error;msg.className='msg ok';msg.textContent='提交成功Submission successful!';success.classList.add('show');e.target.reset()}catch(err){msg.className='msg err';msg.textContent='提交失败：'+(err.message||err)}finally{btn.disabled=false}});
</script>

<script>
(function(){
  // 将 Salesmartly 插件自带的聊天入口固定到页面右侧；不再额外生成自定义聊天图标。
  const CHAT_MATCH=/salesmartly|smartly|ssm|livechat|chat|客服|在线/i;
  const RIGHT_GAP='20px';
  const BOTTOM_GAP='88px';

  function looksLikeChat(el){
    if(!el || el === document.body || el === document.documentElement) return false;
    const txt=[el.id, el.className, el.getAttribute('aria-label'), el.getAttribute('title'), el.getAttribute('src')].join(' ');
    return CHAT_MATCH.test(txt);
  }

  function moveToRight(el){
    if(!el || el.dataset.appealChatRight === '1') return;
    const cs=getComputedStyle(el);
    const rect=el.getBoundingClientRect();
    const isFloating=(cs.position==='fixed' || cs.position==='absolute') && rect.width>20 && rect.height>20;
    const nearLeft=rect.left < Math.min(220, window.innerWidth * 0.35);
    if(!isFloating || !nearLeft) return;

    el.style.left='auto';
    el.style.right=RIGHT_GAP;
    if(cs.position==='absolute') el.style.position='fixed';
    if(rect.top < window.innerHeight * 0.25 || rect.top > window.innerHeight - 160){
      el.style.top='auto';
      el.style.bottom=el.style.bottom || BOTTOM_GAP;
    }
    el.dataset.appealChatRight='1';
  }

  function scan(){
    document.querySelectorAll('iframe,div,button,a').forEach(el=>{
      if(looksLikeChat(el)) moveToRight(el);
    });
  }

  window.addEventListener('load',scan);
  setTimeout(scan,500);
  setTimeout(scan,1500);
  setTimeout(scan,3000);
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class','id','src','title','aria-label']});
})();
</script>
